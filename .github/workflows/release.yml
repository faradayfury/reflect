name: Prepare a Reflect release

on:
  push:
    tags: ['[0-9]*.[0-9]*.[0-9]*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the release version and run tests
        run: |
          node -e 'const { version } = require("./manifest.json"); if (!/^(0|[1-9]\d*)(\.(0|[1-9]\d*)){2}$/.test(version) || version !== process.env.GITHUB_REF_NAME) throw Error("The tag must match the version in manifest.json.")'
          node --check main.js
          node --test tests/*.test.cjs
      - name: Attest the release files
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
      - name: Upload the attested files to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --draft --generate-notes main.js manifest.json styles.css
